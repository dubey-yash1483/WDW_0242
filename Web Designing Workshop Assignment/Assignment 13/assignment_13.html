<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Rowspan and Colspan (Timetable)</title>
    </head>

    <!-- Aim: To build a class timetable using merged rows and columns -->

    <body>
        <table border="1" style="border-collapse: collapse;">
        <caption><b>Weekly Timetable</b></caption>
        <tr>
            <th>Day</th>
            <th>9-10</th>
            <th>10-11</th>
            <th>11-12</th>
        </tr>
    </body>
</html>
