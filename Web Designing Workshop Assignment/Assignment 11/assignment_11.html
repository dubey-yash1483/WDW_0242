<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Accessibility</title>
    </head>

    <!-- Aim: To make a page accessible using language, alt text, ARIA labels, a skip link and a proper heading -->

    <body>
        <!-- Skip Link -->
        <a href="#main">Skip to main content</a>
        <br>

        <!-- Navigation -->
        <nav aria-label="Main Navigation">
            <a href="#">Home</a>
            <a href="#">Help</a>
        </nav>

        <!-- Main Content -->
        <main id="main">

        <h1>Accessible Page</h1>

        <!-- Image with Alt Text -->
        <img src="logo.png" alt="College Logo" width="250" height="25">

        <button aria-label="Close">X</button>

        <br><br>

    </body>
</html>
