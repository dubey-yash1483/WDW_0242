<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Form: Input Elements, Label and Fieldset</title>
    </head>

    <!-- Aim: To create a form using common input types, labels and a fieldset -->

    <body>
        <form>
        <fieldset>

            <legend>Personal Details</legend>

            <label>Name:</label>
            <input type="text">
            <br><br>
            <label>Email:</label>
            <input type="email">
            <br><br>
            <label>Password:</label>
            <input type="password">
            <br><br>
            <label>Gender:</label>
            <input type="radio" name="gender">Male
            <input type="radio" name="gender">Female
            <br><br>
            <label>Hobbies:</label>
            <input type="checkbox">Reading
            <input type="checkbox">Coding
            <br><br>
            <label>DOB:</label>
            <input type="date">

        </fieldset>
        </form>
    </body>

</html>
