<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Select, Textarea and Buttons</title>
    </head>

    <!-- Aim: To add a dropdown, a multi-line text box and different button types  -->
    <body>
        <form>
            <!-- Dropdown Menu -->
            <label>Course:</label>
            <select>
                <option>CSE</option>
                <option>AIML</option>
                <option>ECE</option>
                <option>IT</option>
            </select>
            <br><br>

            <!-- Feedback Textarea -->
            <label>Feedback:</label>
            <br>
             <textarea rows="5" cols="45" placeholder="Write here..."></textarea>
            <br><br>

            <!-- Buttons -->
            <button type="submit">Submit</button>
            <button type="reset">Reset</button>
            <button type="button">Click Me</button>
        </form>
        
    </body>
</html>
