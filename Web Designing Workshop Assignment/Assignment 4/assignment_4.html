<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Semantic and Non-Semantic Elements</title>
    </head>

    <!-- Aim: To build a page layout using semantic tags and compare it with a div layout. -->

    <body>
        <!-- Semantic Layouts -->
         <header>
            <h1>College Portal</h1>
         </header>
         <nav>
            <a href="#">Home</a> |
            <a href="#">Courses</a>
         </nav>
         <main>
            <section>
                <h2>Admission Open</h2>
                <p>Apply before 30 June.</p>
            </section>
            <aside>
                Notice: Library Closed Sunday. 
            </aside>
         </main>
         <footer>
            &copy; 2026 College
         </footer>
         
    </body>
</html>
