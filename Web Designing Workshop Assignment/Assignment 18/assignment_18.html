<!DOCTYPE html>
<html lang="en">
     <!-- Aim: To combine a semantic layout, a table and a validated form in one page -->
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Mini Project: Accessible Student Admission Page</title>
        <style>
            body {
                font-family: Arial;
            }

            header {
                background-color: navy;
                color: white;
                text-align: center;
                padding: 15px;
            }

            main {
                width: 70%;
                margin: auto;
                padding: 20px;
            }
    
            table {
                width: 100%;
                border-collapse: collapse;
            }

            th, td {
                border: 1px solid gray;
                padding: 8px;
                text-align: left;
            }     

            th {
                background-color: #e6e6f2;
                text-align: center;
            }

            fieldset {
                margin-top: 20px;
            }
    
            footer {
                background-color: navy;
                color: white;
                text-align: center;
                padding: 10px;
            }
        </style>
    </head>
    <body>
        <!-- Header -->
        <header>
            <h1>ABC College Admission 2026</h1>
        </header>
        <!-- Main Content -->
        <main>
            <h2>Courses and Fees</h2>
            <!-- Course Table -->
            <table>
                <caption>Available Courses</caption>
                <tr>
                    <th>Course</th>
                    <th>Seats</th>
                    <th>Fees</th>
                </tr>
                 <tr>
                    <td>B.Tech CSE</td>
                    <td>120</td>
                    <td>₹90,000</td>
                </tr>
                <tr>
                    <td>BCA</td>
                    <td>60</td>
                    <td>₹45,000</td>
                </tr>
            </table>

             <!-- Application Form -->
            <form action="submit.php" method="POST">
                <fieldset>
                    <legend>Application Form</legend>

                    <label for="name">Name:</label>
                    <br>
                    <input type="text" id="name" name="name" required>
                    <br><br>

                    <label for="email">Email:</label>
                    <br>
                    <input type="email" id="email" name="email" required>
                    <br><br>

                    <label for="course">Course:</label>
                    <br>

                    <select id="course" name="course">
                        <option>B.Tech CSE</option>
                        <option>BCA</option>
                    </select>
                    <br><br>

                    <label for="statement">Statement:</label>
                    <br>

                    <textarea id="statement" name="statement"
                        rows="4" cols="48"></textarea>
                    <br><br>

                    <button type="submit">Apply</button>
                </fieldset>
            </form>
        </main>
    </body>
</html>
