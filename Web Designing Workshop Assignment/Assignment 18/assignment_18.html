<!DOCTYPE html>
<html lang="en">
     <!-- Aim: To combine a semantic layout, a table and a validated form in one page -->
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Mini Project: Accessible Student Admission Page</title>
        <style>
            body {
                font-family: Arial;
            }

            header {
                background-color: navy;
                color: white;
                text-align: center;
                padding: 15px;
            }

            main {
                width: 70%;
                margin: auto;
                padding: 20px;
            }
    
            table {
                width: 100%;
                border-collapse: collapse;
            }

            th, td {
                border: 1px solid gray;
                padding: 8px;
                text-align: left;
            }     

            th {
                background-color: #e6e6f2;
                text-align: center;
            }

            fieldset {
                margin-top: 20px;
            }
    
            footer {
                background-color: navy;
                color: white;
                text-align: center;
                padding: 10px;
            }
        </style>
    </head>
    <body>
        <!-- Header -->
        <header>
            <h1>ABC College Admission 2026</h1>
        </header>
    </body>
</html>
