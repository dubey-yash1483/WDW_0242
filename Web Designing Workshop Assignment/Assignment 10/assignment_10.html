<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Multimedia: Image, Video, Audio and YouTube</title>
    </head>

    <!-- Aim: To embed an image, video, audio and a YouTube video in one page -->

    <body>
        <h1>Image</h1>
        <img src="college.jpg" alt="College campus" width="150" height="150">

        <h1>Video</h1>
        <video width="300" controls>
            <source src="video.mp4" type="video/mp4">
        </video>

        <h1>Audio</h1>
        <audio controls>
            <source src="audio.mp3" type="audio/mpeg">
        </audio>

        <h1>YouTube</h1>
        <iframe width="320" height="180" src="https://www.youtube.com/embed/VIDEO_ID">
        </iframe>
    </body>
</html>
