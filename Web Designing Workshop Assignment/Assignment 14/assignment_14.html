<!DOCTYPE html>
<html>
    <!-- Aim: To place a table inside a cell and make a wide table scroll on small screens  -->
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Nested and Responsive Tables</title>
        <style>
        table {
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid black;
            padding: 8px;
        }

        .container {
            overflow-x: auto;
        }
    </style>
    </head>
    <body>
        <div class="container">

        <table>

            <tr>
                <th>Day</th>
                <th>Lab Batches</th>
                <th>Faculty</th>
                <th>Room</th>
                <th>Time</th>
            </tr>
            <tr>
                <td>Friday</td>

                <td>
                    <!-- Nested Table -->
                    <table>
                        <tr>
                            <th>Batch</th>
                            <th>System</th>
                        </tr>

                        <tr>
                            <td>A1</td>
                            <td>PC 1-20</td>
                        </tr>

                        <tr>
                            <td>A2</td>
                            <td>PC 21-40</td>
                        </tr>
                    </table>
                </td>

                <td>Dr. Sharma</td>
                <td>Lab 2</td>
                <td>2-4 PM</td>

            </tr>

        </table>
        </div>               
    </body>
</html>
