<!DOCTYPE html>
<html>
    <!-- Aim: To turn an unordered list into a horizontal navigation menu -->
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Navigation Menu Using Lists</title>
        <style>
        ul {
            list-style-type: none;
            background-color: #333;
            padding: 15px;
            margin: 20px;
            display: flex;
        }

        li {
            margin-right: 40px;
        }

        a {
            color: white;
            text-decoration: none;
        }
    </style>
    </head>
    <body>

        <ul>
        <li><a href="#">Home</a></li>
        <li><a href="#">About</a></li>
        <li><a href="#">Courses</a></li>
        <li><a href="#">Contact</a></li>
        </ul>

    </body>
</html>
