<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Table with Headers, Caption and Footer</title>
    </head>

    <!-- Aim: To create a table with caption, header, body and footer sections-->

    <body>
        <table border="1">
        <caption>Student Marks</caption>

        <!-- Table Header -->
        <thead>
            <tr>
                <th>Roll</th>
                <th>Name</th>
                <th>Marks</th>
            </tr>
        </thead>
        
        <!-- Table Body -->
        <tbody>
            <tr>
                <td>1</td>
                <td>Aman</td>
                <td>85</td>
            </tr>

            <tr>
                <td>2</td>
                <td>Riya</td>
                <td>92</td>
            </tr>
        </tbody>
    </body>

</html>
