<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Hyperlinks and Images with Attributes</title>
        <style>
        .container {
            background-color: white;
            height: 450px;
            padding: 12px;
            margin: 20px;
        }
    </style>
    </head>

    <!-- Aim: To use internal, external, email and image links with attributes  -->

    <body>
        <div class="container" id="top">

        <p>Links demo</p>

        <!-- External Link -->
        <a href="https://www.google.com" target="_blank">
            External link
        </a>
        <br>
        <!-- Internal Link -->
        <a href="#bottom">Jump to bottom</a>
        <br>

        <!-- Email Link -->
        <a href="mailto:example@gmail.com">Email us</a>
        <br>

        <!-- Image with Attributes -->
        <a href="https://www.google.com">
            <img src="logo.png" alt="Logo" width="110" height="55">
        </a>

        
    </body>

</html>
