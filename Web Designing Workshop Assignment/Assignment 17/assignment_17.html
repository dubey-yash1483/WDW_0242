<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Form Attributes and Input Validation</title>
    </head>

    <!-- Aim: To apply method, action, required, pattern, min, max and length validation -->

    <body>
        <form action="submit.php" method="POST">
            <!-- Full Name -->
            <input type="text" name="fullname" placeholder="Full name" required>
            <br><br>

            <!-- Email -->
            <input type="email" name="email" placeholder="you@college.edu" required>
            <br><br>

            <!-- Mobile Number -->
            <input type="text" name="mobile" placeholder="10-digit mobile"
            pattern="[0-9]{10}"
            title="Enter exactly 10 digits" required>
            <br><br>

            <!-- Password -->
            <input type="password" name="password"placeholder="Min 6 characters"
            minlength="6" required>
            <br><br>

            <!-- Age -->
            <input type="number" name="age"
            placeholder="Age (17-30)"
            min="17" max="30" required>
            <br><br>

            <!-- Submit Button -->
            <button type="submit">Register</button>
        </form>
    </body>
    
</html>
